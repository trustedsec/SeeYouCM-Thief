[pytest]
addopts = --strict-markers
markers =
    unit: fast isolated tests, no subprocess and no sockets
    smoke: in-process main() CLI dispatch checks
    e2e: subprocess CLI runs against a temp database
    integration: tests that hit real devices/services
    allow_network: opt out of the _no_real_network guard
    keep_test_mode: keep thief._TEST_MODE as set by the environment
