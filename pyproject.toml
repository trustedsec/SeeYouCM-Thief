[build-system]
requires = ["setuptools>=69", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "seeyoucm-thief"
dynamic = ["version"]
description = "Penetration toolkit for extracting credentials from Cisco phone systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    "alive-progress==3.3.0",
    "lxml==6.0.2",
    "tftpy==0.8.7",
]

[project.scripts]
thief = "seeyoucm_thief.thief:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools_scm]
version_file = "src/seeyoucm_thief/_version.py"
version_scheme = "guess-next-dev"

[dependency-groups]
dev = [
    "pytest==9.0.2",
]
