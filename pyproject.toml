[project]
name = "seeyoucm-thief"
version = "0.1.0"
description = "Penetration toolkit for extracting credentials from Cisco phone systems"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests==2.32.5",
    "beautifulsoup4==4.14.3",
    "alive-progress==3.3.0",
    "lxml==6.0.2",
    "tftpy==0.8.7",
]

[project.scripts]
thief = "seeyoucm_thief.thief:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seeyoucm_thief"]

[dependency-groups]
dev = [
    "pytest==9.0.2",
]
